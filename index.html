<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>精選賣場</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Heroicons 圖標庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#f7f8fa] text-gray-800 antialiased min-h-screen pb-20">

  <!-- 頂部品牌 Logo 區域 -->
  <header class="bg-white sticky top-0 z-20 shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-center items-center">
      <h1 class="text-2xl font-black tracking-widest text-slate-800">STORE</h1>
    </div>
  </header>

  <!-- 雙欄商品清單 -->
  <main class="max-w-md mx-auto px-3 py-3">
    <div id="product-grid" class="grid grid-cols-2 gap-2.5">
      <!-- 卡片由 JS 動態生成 -->
    </div>
  </main>

  <!-- 底部常駐導航列（仿 App 樣式） -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-100 z-30 max-w-md mx-auto">
    <div class="grid grid-cols-3 h-14 text-xs font-medium">
      <button class="flex flex-col items-center justify-center text-orange-600 gap-1">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span>首頁</span>
      </button>
      <button class="flex flex-col items-center justify-center text-gray-500 hover:text-gray-800 gap-1">
        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
        <span>購物車</span>
      </button>
      <button class="flex flex-col items-center justify-center text-gray-500 hover:text-gray-800 gap-1">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span>我的</span>
      </button>
    </div>
  </nav>

  <script>
    async function loadProducts() {
      try {
        const response = await fetch('./products.json');
        const products = await response.json();
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';

        products.forEach(item => {
          const isOutOfStock = item.stock <= 0;
          const tagColorClass = item.tagColor === 'red' ? 'text-red-600 font-bold' : 'text-gray-900 font-bold';

          // 建立卡片外層（可直接點擊外跳賣貨便）
          const card = document.createElement(isOutOfStock ? 'div' : 'a');
          if (!isOutOfStock) {
            card.href = item.myshipUrl;
            card.target = "_blank";
            card.rel = "noopener noreferrer";
          }
          card.className = `bg-white rounded-2xl p-2.5 flex flex-col justify-between shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-50 transition active:scale-[0.98] ${
            isOutOfStock ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'
          }`;

          card.innerHTML = `
            <!-- 商品主圖（帶浮動陰影） -->
            <div class="relative w-full aspect-square rounded-xl flex items-center justify-center p-3 mb-2 bg-[#fcfcfd] overflow-hidden">
              <img src="${item.imageUrl}" alt="${item.title}" class="w-full h-full object-contain filter drop-shadow-[0_8px_10px_rgba(0,0,0,0.12)]">
              ${isOutOfStock ? '<div class="absolute inset-0 bg-black/40 flex items-center justify-center text-white text-xs font-bold rounded-xl tracking-wider">已售完</div>' : ''}
            </div>

            <!-- 標題區域 -->
            <div class="mb-2">
              <h3 class="text-[13px] leading-tight text-gray-800 line-clamp-1">
                <span class="${tagColorClass}">【${item.tag}】</span>${item.title}
              </h3>
            </div>

            <!-- 價格與已售數量區間 -->
            <div class="flex items-baseline justify-between mt-auto pt-1">
              <div class="text-[#ff5500] font-extrabold text-[15px] tracking-tight">
                NT$${item.price.toLocaleString()}
              </div>
              <div class="text-gray-400 text-[11px]">
                ${isOutOfStock ? '補貨中' : `已售 ${item.soldCount}件`}
              </div>
            </div>
          `;

          grid.appendChild(card);
        });

        // 渲染圖標
        lucide.createIcons();
      } catch (err) {
        console.error('載入商品資料失敗:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>
